id: metabase-reset-password-sqli

info:
  name: Metabase Unauthenticated SQL Injection in Password Reset (version detection)
  author: endolum
  severity: critical
  description: |
    Metabase 0.58 and newer expose an unauthenticated SQL injection through the
    publicly reachable POST /api/session/reset_password endpoint. An attacker can
    inject arbitrary SQL into the Metabase application database and obtain
    administrator access to the instance, from which stored credentials for every
    connected database can be read. Exploited as a zero-day before the fix shipped.

    This template is a version read, not an exploit. It performs a single GET
    against /api/session/properties, which Metabase serves unauthenticated so the
    login screen can render, and compares the reported build to the vendor's
    minimum safe release for that branch. It never sends a request to the
    vulnerable endpoint.

    Releases below 0.58 are not affected. Branches 0.58 through 0.63 are flagged
    when the release number sits below the vendor's minimum safe release
    (0.58.24, 0.59.21, 0.60.17, 0.61.11, 0.62.9, 0.63.5). The advisory's own
    vulnerable ranges stop one release short of each of those numbers, so builds
    landing in that gap are flagged here for manual confirmation rather than
    being silently treated as fixed.
  reference:
    - https://github.com/metabase/metabase/security/advisories/GHSA-vwf4-m7j8-wcjf
    - https://www.metabase.com/blog/security-update
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-89
  metadata:
    shodan-query: http.html:"Metabase"
    verified: true
    max-request: 1
  tags: metabase,sqli,exposure,unauth,endolum

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/session/properties"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      # Confirms the response really is Metabase's public settings document
      # before any version claim is made about it.
      - type: word
        part: body
        words:
          - '"tag"'
          - '"engines"'
        condition: and

      # Branch 0.58 through 0.63 below the vendor's minimum safe release.
      # Alternatives are ordered longest first so the two digit releases are
      # tried before the one digit ones.
      - type: regex
        part: body
        regex:
          - '"tag"\s*:\s*"v?(?:id-v)?[01]\.(?:58\.(?:2[0-3]|1[0-9]|[0-9])|59\.(?:20|1[0-9]|[0-9])|60\.(?:1[0-6]|[0-9])|61\.(?:10|[0-9])|62\.[0-8]|63\.[0-4])(?:\.[0-9]+)?"'

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '"tag"\s*:\s*"(v?(?:id-v)?[01]\.[0-9]+\.[0-9]+(?:\.[0-9]+)?)"'

      - type: regex
        name: build_date
        part: body
        group: 1
        regex:
          - '"date"\s*:\s*"([0-9]{4}-[0-9]{2}-[0-9]{2})"'
